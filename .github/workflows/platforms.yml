name: Fork platform builds

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Linux tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: ./scripts/run-tests.sh

  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            command: build:linux-x64
            artifact: packages/core/dist/kulala-core-linux-x86_64
          - platform: linux-aarch64
            runner: ubuntu-latest
            command: build:linux-arm64
            artifact: packages/core/dist/kulala-core-linux-aarch64
          - platform: windows-x86_64
            runner: windows-2025
            command: build:windows-x64
            artifact: packages/core/dist/kulala-core-windows-x86_64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.command }}
      - name: Verify artifact
        shell: bash
        run: test -s "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kulala-core-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

